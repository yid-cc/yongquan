<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理后台 · 永泉建筑科技</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f0f4f9; color:#1a1a2e; padding:30px; }
        .container { max-width:960px; margin:0 auto; }
        h1 { font-size:28px; margin-bottom:6px; }
        .subtitle { color:#999; font-size:14px; margin-bottom:24px; }
        .tabs { display:flex; gap:4px; margin-bottom:24px; background:#e2e8f0; padding:4px; border-radius:10px; width:fit-content; }
        .tab { padding:10px 28px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; background:transparent; color:#555; transition:0.2s; }
        .tab.active { background:#fff; color:#0066ff; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .tab:hover:not(.active) { color:#333; }
        .card { background:#fff; border-radius:14px; padding:28px; margin-bottom:24px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
        .card h2 { font-size:18px; margin-bottom:18px; color:#0066ff; }
        .form-row { margin-bottom:16px; }
        .form-row label { display:block; font-weight:500; margin-bottom:6px; font-size:14px; color:#444; }
        .form-row input, .form-row textarea { width:100%; padding:10px 14px; border:1px solid #dde; border-radius:8px; font-size:15px; transition:0.2s; font-family:inherit; }
        .form-row input:focus, .form-row textarea:focus { outline:none; border-color:#0066ff; box-shadow:0 0 0 3px rgba(0,102,255,0.1); }
        .form-row textarea { resize:vertical; min-height:70px; }
        .form-row-inline { display:flex; gap:14px; flex-wrap:wrap; }
        .form-row-inline .form-row { flex:1; min-width:150px; }
        .btn { padding:10px 28px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:0.2s; display:inline-block; }
        .btn-primary { background:#0066ff; color:#fff; }
        .btn-primary:hover { background:#004ddb; }
        .btn-secondary { background:#e8f0fe; color:#0066ff; }
        .btn-secondary:hover { background:#d0e2ff; }
        .btn-danger { background:#fee; color:#d33; }
        .btn-danger:hover { background:#fdd; }
        .btn-sm { padding:6px 16px; font-size:13px; }
        .actions { display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
        .list-item { border:1px solid #eef; border-radius:10px; padding:16px 18px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
        .list-item:hover { border-color:#ccd; background:#fafcff; }
        .list-info { flex:1; min-width:0; }
        .list-info .item-date { font-size:13px; color:#999; }
        .list-info .item-title { font-size:16px; font-weight:500; margin:4px 0; }
        .list-info .item-tags { font-size:12px; color:#0066ff; }
        .list-info .item-link { font-size:12px; color:#aaa; word-break:break-all; }
        .empty-state { text-align:center; padding:40px; color:#999; }
        .empty-state .icon { font-size:48px; margin-bottom:16px; }
        .toast { position:fixed; top:20px; right:20px; background:#0066ff; color:#fff; padding:14px 24px; border-radius:10px; font-size:14px; box-shadow:0 4px 20px rgba(0,102,255,0.3); opacity:0; transition:0.3s; pointer-events:none; z-index:999; }
        .toast.show { opacity:1; }
        .toast.warning { background:#d33; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:6px; }
        .footer-note { text-align:center; padding:20px; color:#999; font-size:13px; line-height:1.8; }
        .admin-link { display:inline-block; margin-bottom:0; color:#0066ff; font-size:14px; text-decoration:none; }
        .admin-link:hover { text-decoration:underline; }
        .hidden { display:none !important; }
        .feature-row { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
        .feature-row input { flex:1; }
        .feature-row .btn-sm { flex-shrink:0; }
        .feature-list { margin-bottom:12px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;">
            <div>
                <h1>📰 内容管理后台</h1>
                <p class="subtitle">永泉建筑科技官网</p>
            </div>
            <div>
                <a href="index.html" class="admin-link" target="_blank">🏠 首页</a>&nbsp;&nbsp;
                <a href="news.html" class="admin-link" target="_blank">📋 新闻页</a>&nbsp;&nbsp;
                <a href="solutions.html" class="admin-link" target="_blank">🔧 解决方案页</a>
            </div>
        </div>

        <!-- 标签切换 -->
        <div class="tabs">
            <button class="tab active" id="tabNews" onclick="switchTab('news')">📰 新闻管理</button>
            <button class="tab" id="tabSolutions" onclick="switchTab('solutions')">🔧 解决方案管理</button>
        </div>

        <!-- ========== 新闻管理面板 ========== -->
        <div id="panelNews">
            <div class="card" id="newsFormCard">
                <h2 id="newsFormTitle">📝 添加新闻</h2>
                <input type="hidden" id="newsEditIndex" value="-1">
                <div class="form-row-inline">
                    <div class="form-row"><label>日期</label><input type="date" id="newsDate"></div>
                    <div class="form-row" style="flex:2;"><label>标题 <span style="color:#d33;">*</span></label><input type="text" id="newsTitle" placeholder="输入新闻标题"></div>
                </div>
                <div class="form-row"><label>标签（逗号分隔）</label><input type="text" id="newsTags" placeholder="例如：新材料, 公司动态"></div>
                <div class="form-row"><label>链接地址 <span style="color:#d33;">*</span></label><input type="text" id="newsLink" placeholder="news-detail.html?id=0 或 https://..."></div>
                <div class="form-row"><label>摘要</label><textarea id="newsSummary" rows="3" placeholder="新闻摘要..."></textarea></div>
                <div class="actions">
                    <button class="btn btn-primary" onclick="saveNews()">💾 保存</button>
                    <button class="btn btn-secondary" onclick="resetNewsForm()">↺ 重置</button>
                </div>
            </div>
            <div class="card">
                <div class="header-bar">
                    <h2>📋 新闻列表（<span id="newsCount">0</span>条）</h2>
                    <div class="actions">
                        <button class="btn btn-sm btn-secondary" onclick="exportData('yongquan_news', 'datanews')">📤 导出JSON</button>
                        <button class="btn btn-sm btn-secondary" onclick="document.getElementById('newsImportInput').click()">📥 导入JSON</button>
                        <button class="btn btn-sm btn-danger" onclick="syncToFile('yongquan_news', 'datanews.json')">💾 同步到文件</button>
                        <input type="file" id="newsImportInput" accept=".json" style="display:none" onchange="importData(event, 'yongquan_news')">
                    </div>
                </div>
                <div id="newsList"></div>
            </div>
        </div>

        <!-- ========== 解决方案管理面板 ========== -->
        <div id="panelSolutions" class="hidden">
            <div class="card" id="solFormCard">
                <h2 id="solFormTitle">📝 添加解决方案</h2>
                <input type="hidden" id="solEditIndex" value="-1">
                <div class="form-row-inline">
                    <div class="form-row" style="flex:0 0 80px;"><label>图标</label><input type="text" id="solIcon" placeholder="🧱"></div>
                    <div class="form-row" style="flex:0 0 180px;"><label>ID标识</label><input type="text" id="solId" placeholder="new-materials"></div>
                    <div class="form-row" style="flex:2;"><label>标题 <span style="color:#d33;">*</span></label><input type="text" id="solTitle" placeholder="解决方案标题"></div>
                </div>
                <div class="form-row"><label>标签（逗号分隔）</label><input type="text" id="solTags" placeholder="土壤固化剂, 防水新材料"></div>
                <div class="form-row"><label>描述</label><textarea id="solDesc" rows="2" placeholder="简要描述..."></textarea></div>
                <div class="form-row">
                    <label>特性列表（名称 | 详情） <button class="btn btn-sm btn-secondary" onclick="addFeatureRow()" type="button">+ 添加一行</button></label>
                    <div id="featureList" class="feature-list"></div>
                </div>
                <div class="form-row"><label>链接地址 <span style="color:#d33;">*</span></label><input type="text" id="solLink" placeholder="services.html"></div>
                <div class="actions">
                    <button class="btn btn-primary" onclick="saveSolution()">💾 保存</button>
                    <button class="btn btn-secondary" onclick="resetSolForm()">↺ 重置</button>
                </div>
            </div>
            <div class="card">
                <div class="header-bar">
                    <h2>🔧 解决方案列表（<span id="solCount">0</span>项）</h2>
                    <div class="actions">
                        <button class="btn btn-sm btn-secondary" onclick="exportData('yongquan_solutions', 'datasolutions')">📤 导出JSON</button>
                        <button class="btn btn-sm btn-secondary" onclick="document.getElementById('solImportInput').click()">📥 导入JSON</button>
                        <button class="btn btn-sm btn-danger" onclick="syncToFile('yongquan_solutions', 'datasolutions.json')">💾 同步到文件</button>
                        <input type="file" id="solImportInput" accept=".json" style="display:none" onchange="importData(event, 'yongquan_solutions')">
                    </div>
                </div>
                <div id="solList"></div>
            </div>
        </div>

        <div class="footer-note">
            💡 所有修改保存在浏览器本地。请定期导出JSON备份。<br>
            点击「同步到文件」可将当前数据以JSON格式展示，方便复制替换对应的文件。
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ====== 全局数据 ======
        var newsData = [];
        var solutionsData = [];
        var currentTab = 'news';

        // ====== 初始化 ======
        (function init() {
            document.getElementById('newsDate').value = new Date().toISOString().split('T')[0];
            loadData('yongquan_news', 'datanews.json', function(data) { newsData = data; renderNewsList(); });
            loadData('yongquan_solutions', 'datasolutions.json', function(data) { solutionsData = data; renderSolList(); });
        })();

        function loadData(storageKey, jsonFile, callback) {
            var stored = localStorage.getItem(storageKey);
            if (stored) {
                try { var d = JSON.parse(stored); if (d && d.length > 0) { callback(d); return; } } catch(e) {}
            }
            fetch(jsonFile)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    localStorage.setItem(storageKey, JSON.stringify(d));
                    callback(d);
                })
                .catch(function() {
                    callback([]);
                });
        }

        // ====== 标签切换 ======
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabNews').className = tab === 'news' ? 'tab active' : 'tab';
            document.getElementById('tabSolutions').className = tab === 'solutions' ? 'tab active' : 'tab';
            document.getElementById('panelNews').className = tab === 'news' ? '' : 'hidden';
            document.getElementById('panelSolutions').className = tab === 'solutions' ? '' : 'hidden';
        }

        // ====== Toast ======
        function showToast(msg, type) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (type === 'warning' ? ' warning' : '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ====== 导出 ======
        function exportData(storageKey, prefix) {
            var data = JSON.parse(localStorage.getItem(storageKey) || '[]');
            var today = new Date().toISOString().split('T')[0];
            var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = prefix + '_backup_' + today + '.json';
            a.click();
            showToast('📤 导出成功');
        }

        // ====== 导入 ======
        function importData(event, storageKey) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('需要数组格式');
                    if (confirm('导入 ' + data.length + ' 条数据，覆盖当前内容？')) {
                        localStorage.setItem(storageKey, JSON.stringify(data));
                        if (storageKey === 'yongquan_news') { newsData = data; renderNewsList(); }
                        else { solutionsData = data; renderSolList(); }
                        showToast('✅ 导入成功');
                    }
                } catch(err) { showToast('⚠️ 导入失败：' + err.message, 'warning'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ====== 同步到文件 ======
        function syncToFile(storageKey, fileName) {
            var data = JSON.parse(localStorage.getItem(storageKey) || '[]');
            var jsonStr = JSON.stringify(data, null, 2);
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:998;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:white;border-radius:14px;padding:25px;max-width:700px;width:90%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);';
            box.innerHTML = '<h3 style="margin-bottom:8px;color:#0066ff;">💾 同步到 ' + fileName + '</h3><p style="font-size:13px;color:#555;margin-bottom:15px;">复制下面全部内容，粘贴替换 <strong>' + fileName + '</strong> 文件。</p>';
            var ta = document.createElement('textarea');
            ta.value = jsonStr;
            ta.style.cssText = 'width:100%;height:300px;padding:15px;font-size:13px;font-family:monospace;border:1px solid #0066ff;border-radius:8px;';
            ta.readOnly = true;
            box.appendChild(ta);
            var copyBtn = document.createElement('button');
            copyBtn.className = 'btn btn-primary';
            copyBtn.textContent = '📋 复制';
            copyBtn.style.marginTop = '12px';
            copyBtn.onclick = function() { ta.select(); document.execCommand('copy'); showToast('✅ 已复制'); };
            box.appendChild(copyBtn);
            var closeBtn = document.createElement('button');
            closeBtn.className = 'btn btn-secondary';
            closeBtn.textContent = '关闭';
            closeBtn.style.marginTop = '12px'; closeBtn.style.marginLeft = '10px';
            closeBtn.onclick = function() { document.body.removeChild(overlay); };
            box.appendChild(closeBtn);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
            overlay.onclick = function(e) { if (e.target === overlay) document.body.removeChild(overlay); };
        }

        // ==========================================
        //              新闻管理
        // ==========================================
        function renderNewsList() {
            var list = document.getElementById('newsList');
            document.getElementById('newsCount').textContent = newsData.length;
            if (!newsData.length) { list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无新闻</p></div>'; return; }
            var h = '';
            for (var i = 0; i < newsData.length; i++) {
                var it = newsData[i];
                h += '<div class="list-item"><div class="list-info"><div class="item-date">📅 ' + it.date + '</div><div class="item-title">' + escapeHtml(it.title) + '</div><div class="item-tags">🏷 ' + (it.tags||[]).join(' · ') + '</div><div class="item-link">🔗 ' + escapeHtml(it.link) + '</div></div><div class="actions" style="flex-shrink:0;"><button class="btn btn-sm btn-secondary" onclick="editNews(' + i + ')">✏️ 编辑</button><button class="btn btn-sm btn-danger" onclick="deleteNews(' + i + ')">🗑 删除</button></div></div>';
            }
            list.innerHTML = h;
        }

        function saveNews() {
            var idx = parseInt(document.getElementById('newsEditIndex').value);
            var title = document.getElementById('newsTitle').value.trim();
            var link = document.getElementById('newsLink').value.trim();
            if (!title) { showToast('⚠️ 请填写标题','warning'); return; }
            if (!link) { showToast('⚠️ 请填写链接','warning'); return; }
            var obj = {
                date: document.getElementById('newsDate').value,
                title: title,
                tags: document.getElementById('newsTags').value.split(/[,，]/).map(function(s){return s.trim();}).filter(function(s){return s;}),
                summary: document.getElementById('newsSummary').value.trim(),
                link: link
            };
            if (idx === -1) newsData.unshift(obj); else newsData[idx] = obj;
            localStorage.setItem('yongquan_news', JSON.stringify(newsData));
            resetNewsForm(); renderNewsList(); showToast('✅ 已保存');
        }

        function editNews(i) {
            var it = newsData[i];
            document.getElementById('newsEditIndex').value = i;
            document.getElementById('newsDate').value = it.date;
            document.getElementById('newsTitle').value = it.title;
            document.getElementById('newsTags').value = (it.tags||[]).join(', ');
            document.getElementById('newsSummary').value = it.summary||'';
            document.getElementById('newsLink').value = it.link||'';
            document.getElementById('newsFormTitle').textContent = '✏️ 编辑新闻';
            document.getElementById('newsFormCard').scrollIntoView({behavior:'smooth'});
        }

        function deleteNews(i) {
            if (!confirm('确定删除「' + newsData[i].title + '」？')) return;
            newsData.splice(i,1);
            localStorage.setItem('yongquan_news', JSON.stringify(newsData));
            renderNewsList(); showToast('🗑 已删除');
        }

        function resetNewsForm() {
            document.getElementById('newsEditIndex').value = '-1';
            document.getElementById('newsDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsTags').value = '';
            document.getElementById('newsSummary').value = '';
            document.getElementById('newsLink').value = 'news.html';
            document.getElementById('newsFormTitle').textContent = '📝 添加新闻';
        }

        // ==========================================
        //            解决方案管理
        // ==========================================
        function renderSolList() {
            var list = document.getElementById('solList');
            document.getElementById('solCount').textContent = solutionsData.length;
            if (!solutionsData.length) { list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无解决方案</p></div>'; return; }
            var h = '';
            for (var i = 0; i < solutionsData.length; i++) {
                var it = solutionsData[i];
                var featCount = it.features ? it.features.length : 0;
                h += '<div class="list-item"><div class="list-info"><div class="item-title">' + (it.icon||'📦') + ' ' + escapeHtml(it.title) + '</div><div class="item-tags">🏷 ' + (it.tags||[]).join(' · ') + '</div><div class="item-link">📋 ' + featCount + '个特性 | 🔗 ' + escapeHtml(it.link) + '</div></div><div class="actions" style="flex-shrink:0;"><button class="btn btn-sm btn-secondary" onclick="editSolution(' + i + ')">✏️ 编辑</button><button class="btn btn-sm btn-danger" onclick="deleteSolution(' + i + ')">🗑 删除</button></div></div>';
            }
            list.innerHTML = h;
        }

        function addFeatureRow(name, detail) {
            var div = document.createElement('div');
            div.className = 'feature-row';
            div.innerHTML = '<input type="text" placeholder="特性名称" value="' + (name||'') + '" class="feat-name"><input type="text" placeholder="特性详情" value="' + (detail||'') + '" class="feat-detail"><button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" type="button">✕</button>';
            document.getElementById('featureList').appendChild(div);
        }

        function getFeatures() {
            var rows = document.querySelectorAll('#featureList .feature-row');
            var feats = [];
            rows.forEach(function(row) {
                var n = row.querySelector('.feat-name').value.trim();
                var d = row.querySelector('.feat-detail').value.trim();
                if (n) feats.push({name:n, detail:d});
            });
            return feats;
        }

        function saveSolution() {
            var idx = parseInt(document.getElementById('solEditIndex').value);
            var title = document.getElementById('solTitle').value.trim();
            var link = document.getElementById('solLink').value.trim();
            if (!title) { showToast('⚠️ 请填写标题','warning'); return; }
            if (!link) { showToast('⚠️ 请填写链接','warning'); return; }
            var obj = {
                id: document.getElementById('solId').value.trim() || ('sol-' + Date.now()),
                icon: document.getElementById('solIcon').value.trim() || '📦',
                title: title,
                tags: document.getElementById('solTags').value.split(/[,，]/).map(function(s){return s.trim();}).filter(function(s){return s;}),
                description: document.getElementById('solDesc').value.trim(),
                features: getFeatures(),
                link: link
            };
            if (idx === -1) solutionsData.push(obj); else solutionsData[idx] = obj;
            localStorage.setItem('yongquan_solutions', JSON.stringify(solutionsData));
            resetSolForm(); renderSolList(); showToast('✅ 已保存');
        }

        function editSolution(i) {
            var it = solutionsData[i];
            document.getElementById('solEditIndex').value = i;
            document.getElementById('solIcon').value = it.icon||'📦';
            document.getElementById('solId').value = it.id||'';
            document.getElementById('solTitle').value = it.title;
            document.getElementById('solTags').value = (it.tags||[]).join(', ');
            document.getElementById('solDesc').value = it.description||'';
            document.getElementById('solLink').value = it.link||'';
            document.getElementById('solFormTitle').textContent = '✏️ 编辑解决方案';
            document.getElementById('featureList').innerHTML = '';
            if (it.features) { it.features.forEach(function(f) { addFeatureRow(f.name, f.detail); }); }
            document.getElementById('solFormCard').scrollIntoView({behavior:'smooth'});
        }

        function deleteSolution(i) {
            if (!confirm('确定删除「' + solutionsData[i].title + '」？')) return;
            solutionsData.splice(i,1);
            localStorage.setItem('yongquan_solutions', JSON.stringify(solutionsData));
            renderSolList(); showToast('🗑 已删除');
        }

        function resetSolForm() {
            document.getElementById('solEditIndex').value = '-1';
            document.getElementById('solIcon').value = '📦';
            document.getElementById('solId').value = '';
            document.getElementById('solTitle').value = '';
            document.getElementById('solTags').value = '';
            document.getElementById('solDesc').value = '';
            document.getElementById('solLink').value = 'services.html';
            document.getElementById('featureList').innerHTML = '';
            document.getElementById('solFormTitle').textContent = '📝 添加解决方案';
        }
    </script>
</body>
</html>
