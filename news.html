    <style>
        :root { --primary: #0066ff; --primary-dark: #0044cc; --accent: #00c2a8; --text: #1a1a2e; --text-secondary: #555; --bg: #ffffff; --bg-light: #f5f8ff; --border: #e0e6f0; --radius: 16px; --shadow: 0 8px 30px rgba(0,0,0,0.04); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 30px; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; }
        .logo { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-decoration: none; }
        .logo img { height: 44px; width: auto; }
        .nav-links { display: flex; list-style: none; gap: 36px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover { color: var(--primary); }
        .menu-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; }
        .menu-toggle span { display: block; width: 25px; height: 2px; background: var(--primary); }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .menu-toggle { display: flex; }
            .nav-links.active { display: flex; flex-direction: column; position: absolute; top: 70px; left: 0; right: 0; background: white; padding: 20px 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); gap: 16px; }
        }
        .page-header { padding: 140px 0 40px; text-align: center; }
        .page-header h1 { font-size: 40px; color: var(--text); margin-bottom: 15px; }
        .page-header p { color: var(--text-secondary); font-size: 18px; }
        .news-list { padding-bottom: 80px; }
        .news-item { padding: 35px 0; border-bottom: 1px solid var(--border); }
        .news-item:last-child { border-bottom: none; }
        .news-date { font-size: 14px; color: #999; margin-bottom: 8px; }
        .news-item h3 { font-size: 24px; color: var(--text); margin-bottom: 12px; }
        .news-item h3 a { color: inherit; text-decoration: none; transition: color 0.2s; }
        .news-item h3 a:hover { color: var(--primary); }
        .news-item .meta { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .news-tag { display: inline-block; background: #e8f0fe; color: var(--primary); padding: 3px 12px; border-radius: 15px; font-size: 13px; }
        .news-item p { color: var(--text-secondary); font-size: 16px; line-height: 1.7; margin-bottom: 10px; }
        .read-more { color: var(--primary); font-weight: 500; text-decoration: none; }
        .read-more:hover { text-decoration: underline; }
        .footer { background: var(--bg-light); padding: 45px 0; text-align: center; color: var(--text-secondary); font-size: 14px; border-top: 1px solid var(--border); }
        .footer h3 { color: var(--primary); margin-bottom: 15px; }
        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-secondary); text-decoration: none; }
        .footer-links a:hover { color: var(--primary); }
        .ai-fab { position: fixed; bottom: 30px; right: 30px; z-index: 300; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0066ff, #00c2a8); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(0,102,255,0.4); cursor: pointer; font-size: 24px; }
        .ai-fab:hover { transform: scale(1.1); }
        .ai-chat { position: fixed; bottom: 100px; right: 30px; width: 300px; z-index: 300; background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); overflow: hidden; display: none; flex-direction: column; }
        .ai-chat.active { display: flex; }
        .chat-header { background: linear-gradient(120deg, #0a1a3a, #0d2b4e); color: white; padding: 16px 20px; font-weight: 600; display: flex; justify-content: space-between; }
        .chat-body { padding: 20px; }
        .chat-body p { font-size: 14px; color: #555; margin-bottom: 12px; }
        .chat-btn { display: block; width: 100%; text-align: left; padding: 10px 15px; border: 1px solid var(--border); border-radius: 10px; background: white; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .chat-btn:hover { background: #f5f8ff; border-color: #0066ff; }
        .loading-state { text-align: center; padding: 60px 20px; color: #999; }
        .loading-state .icon { font-size: 32px; margin-bottom: 12px; }
        .error-state { text-align: center; padding: 60px 20px; color: #d33; }
    </style>
</head>

        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {

        });
        var aiFab = document.getElementById('aiFab');
        var aiChat = document.getElementById('aiChat');
        aiFab.addEventListener('click', function() { aiChat.classList.toggle('active'); });
        document.getElementById('chatClose').addEventListener('click', function() { aiChat.classList.remove('active'); });
        AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true });

        // ===== 内置兜底数据（当所有数据源都不可用时） =====
        var FALLBACK_NEWS = [
            {"date":"2025-04-28","title":"永泉YS系列土壤固化剂通过省级鉴定，固废利用率超70%","tags":["新材料","公司动态"],"summary":"永泉自主研发的YS-1型离子土壤固化剂近日通过浙江省建材工业协会鉴定，可实现就地土壤固化，固废利用率高达70%以上，水泥用量减少40%，处理后地基承载力可达300kPa。该材料已应用于杭州钱塘区多条市政道路基层，预计可降低工程造价15%。","link":"news-detail.html?id=0"},
            {"date":"2025-04-25","title":"无人机+AI土方测量系统投入使用，效率提升20倍","tags":["智能装备","技术前沿"],"summary":"永泉技术团队在杭州某智慧工地完成无人机AI土方测量对比测试：100亩复杂地形，从航线规划、自动航飞到土方量计算输出报告仅需45分钟，传统RTK测量需2天，效率提升20倍以上。系统土方量误差控制在1.5%以内。","link":"news-detail.html?id=1"},
            {"date":"2025-04-20","title":"国务院国资委发文推动央企\u201CAI+\u201D行动，建筑业成重点场景","tags":["政策风向"],"summary":"国务院国资委召开中央企业\u201CAI+\u201D专项行动推进会，明确在建筑、制造、能源等八大领域推动人工智能深度融合。文件特别指出鼓励智能设计、工地监控、数字孪生等应用落地。永泉AI智筑平台多项功能与政策方向高度吻合。","link":"news-detail.html?id=2"},
            {"date":"2025-04-15","title":"自修复水泥基材料首次应用于地下管廊，裂缝自动愈合效果达标","tags":["新材料","案例"],"summary":"永泉联合浙江大学建筑工程学院研发的自修复水泥基材料，在杭州某综合管廊项目完成首次工程应用。经3个月跟踪观测，宽度\u22640.4mm的裂缝在遇水后自动愈合，抗渗性能恢复至初始值的85%以上，预计可将管廊养护周期延长30%。","link":"news-detail.html?id=3"},
            {"date":"2025-04-10","title":"建筑行业用工难？砌筑机器人给出新答案","tags":["智能装备","行业观察"],"summary":"面对建筑工人老龄化问题，永泉砌筑机器人在试验标段交出成绩单：标准砖砌筑速度300块/小时，垂直度偏差\u22642mm，可连续工作12小时。一台设备可替代2-3名熟练砌筑工，为行业\u201C智改数转\u201D提供新思路。","link":"news-detail.html?id=4"},
            {"date":"2025-04-05","title":"永泉建筑科技正式挂牌，三箭齐发开启新篇章","tags":["公司新闻"],"summary":"原浙江永泉市政园林工程有限公司宣布完成战略转型，永泉建筑科技正式挂牌。公司同时发布三大业务方向：新型建筑材料研发、智能装备集成、永泉AI智筑平台。董事长表示：\u201C我们要用科技重新定义每一块砖、每一度电、每一寸土地。\u201D","link":"news-detail.html?id=5"}
        ];

        // ===== 渲染函数 =====
        function renderNewsList(data) {
            var container = document.getElementById('newsList');
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:#999;"><p>📭 暂无新闻资讯</p></div>';
                return;
            }
            container.innerHTML = '';
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var parts = item.date.split('-');
                var dateDisplay = parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
                var tagsHtml = '';
                for (var t = 0; t < item.tags.length; t++) {
                    tagsHtml += '<span class="news-tag">' + item.tags[t] + '</span>';
                }
                var div = document.createElement('div');
                div.className = 'news-item';
                div.setAttribute('data-aos', 'fade-up');
                div.setAttribute('data-aos-delay', String(i * 50));
                div.innerHTML =
                    '<div class="news-date">' + dateDisplay + '</div>' +
                    '<h3><a href="' + item.link + '">' + item.title + '</a></h3>' +
                    '<div class="meta">' + tagsHtml + '</div>' +
                    '<p>' + item.summary + '</p>' +
                    '<a href="' + item.link + '" class="read-more">阅读详情 →</a>';
                container.appendChild(div);
            }
            if (typeof AOS !== 'undefined') AOS.refresh();
        }

        // ===== 数据加载策略：localStorage → fetch datanews.json → 内置兜底 =====
        (function loadNewsData() {
            // 第1优先：浏览器 localStorage（admin.html 编辑后会存到这里）
            var stored = localStorage.getItem('yongquan_news');
            if (stored) {
                try {
                    var localData = JSON.parse(stored);
                    if (localData && localData.length > 0) {
                        console.log('✅ 新闻来源：localStorage（admin后台编辑的数据）');
                        renderNewsList(localData);
                        return;
                    }
                } catch(e) {}
            }

            // 第2优先：fetch datanews.json（服务器模式下可用）
            console.log('📡 localStorage 为空，尝试 fetch datanews.json...');
            fetch('datanews.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    if (data && data.length > 0) {
                        console.log('✅ 新闻来源：datanews.json（fetch 成功）');
                        // 同时写入 localStorage，供 admin.html 和下次访问使用
                        localStorage.setItem('yongquan_news', JSON.stringify(data));
                        renderNewsList(data);
                    } else {
                        throw new Error('JSON 为空');
                    }
                })
                .catch(function(err) {
                    console.warn('⚠️ fetch 也失败，使用内置兜底数据。错误: ' + err.message);
                    renderNewsList(FALLBACK_NEWS);
                });
        })();
    </script>
